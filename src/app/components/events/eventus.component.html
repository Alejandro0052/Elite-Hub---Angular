<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
  <div *ngFor="let item of items" class="rounded-lg bg-white p-4 shadow-md hover:shadow-lg transition-shadow duration-300">
    <img [src]="item.image" [alt]="item.title" class="h-48 w-full object-cover rounded-t-lg" />
    <div class="p-2">
      <h3 class="text-xl font-bold text-gray-800">{{ item.title  }}</h3>
      <p class="text-sm text-gray-600">{{ item.description }}</p>
      <p class="text-xs text-gray-500 mt-2">{{ item.date | date: 'medium' }}</p>
    </div>
  </div>
</div>
