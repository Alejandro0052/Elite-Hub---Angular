<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
  <div
    *ngFor="let item of items"
    class="rounded-xl overflow-hidden bg-white shadow-lg transition-transform duration-300 hover:scale-105 hover:shadow-xl"
  >
    <img [src]="item.image" [alt]="item.title" class="h-48 w-full object-cover" />
    <div class="p-4 space-y-2">
      <h3 class="text-lg font-semibold text-gray-800">{{ item.title }}</h3>
      <p class="text-sm text-gray-600">{{ item.description }}</p>
      <p class="text-xs text-gray-500">{{ item.date | date: 'longDate' }}</p>
    </div>
  </div>
</div>
