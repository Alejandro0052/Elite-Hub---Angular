<div class="max-w-[100rem] mx-auto px-6 py-10 text-white">
<div class="flex items-center justify-between mb-6">
<h1 class="text-5xl font-bold" id="cardeventos">Eventos</h1>
<a
  id="backeventos"
  routerLink="/"
  class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl text-lg shadow-md transition-transform transform hover:scale-105"
>
  ⬅ Volver
</a>

</div>
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
<div
      *ngFor="let item of eventos"
      class="rounded-xl overflow-hidden bg-white shadow-lg transition-transform duration-300 hover:scale-105 hover:-translate-y-1 hover:shadow-xl"
>
<img [src]="item.image" [alt]="item.title" class="h-48 w-full object-cover" />
<div class="p-4 space-y-2 text-black">
<h3 class="text-lg font-semibold">{{ item.title }}</h3>
<p class="text-sm text-gray-700">{{ item.description }}</p>
<p class="text-xs text-gray-500">{{ item.date | date: 'longDate' }}</p>
</div>
</div>
</div>
</div>
